<!-- Write a HTML program, to explain the working of hyperlinks using <a> tag and href,
target Attributes. -->
<html>
<head>
    <title>hyperlinks with target</title>
</head>
<body>
    <a href="https://www.youtube.com" target="_self">click to open youtube</a><br>
    <a href="https://www.instagram.com" target="_blank">click to open instagram</a><br>
    <a href="https://www.facebook.com" target="_blank">click to open facebook</a>
</body>
</html>
